services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: autocodit-agent-db
    environment:
      - POSTGRES_DB=autocodit_agent
      - POSTGRES_USER=autocodit
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    networks:
      - autocodit
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocodit -d autocodit_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: autocodit-agent-redis
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    networks:
      - autocodit
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Core API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: autocodit-agent-api
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://autocodit:password@db:5432/autocodit_agent
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOG_LEVEL=DEBUG
      - HOT_RELOAD=true
      - DEV_MODE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-workspace:/workspace
    networks:
      - autocodit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: autocodit-agent-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
      - NEXT_PUBLIC_APP_NAME=AutoCodit Agent
      - NODE_ENV=development
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - autocodit
    restart: unless-stopped

volumes:
  runner-workspace:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  autocodit:
    driver: bridge
    name: autocodit-agent-network